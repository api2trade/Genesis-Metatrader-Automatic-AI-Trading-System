services:
  genesis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genesis
    restart: unless-stopped

    # ── Mount your .env file ────────────────────────────────────────────────
    volumes:
      - ./.env:/opt/hermes-agent/.env:ro         # Your credentials (read-only)
      - genesis_logs:/var/log/hermes              # Hermes decision logs
      - genesis_strategy_logs:/var/log            # Per-strategy logs
      - genesis_cache:/tmp                        # Cache files

    # ── Environment overrides (optional) ────────────────────────────────────
    environment:
      - TZ=UTC
      - GENESIS_MODE=live            # Set to "analyze" to disable execution

    # ── Health check — confirms API2TRADE is reachable ──────────────────────
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import os,requests; r=requests.get('https://mt5.mt4api.dev/AccountSummary',params={'id':os.getenv('MT5_ACCOUNT_UUID','')},auth=(os.getenv('MT5_API_USER',''),os.getenv('MT5_API_PASS','')),timeout=5); exit(0 if r.status_code==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    # ── Resource limits ──────────────────────────────────────────────────────
    mem_limit: 512m
    cpus: "0.5"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  genesis_logs:
  genesis_strategy_logs:
  genesis_cache:
